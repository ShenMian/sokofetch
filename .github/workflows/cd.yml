name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          name="sokobanonline-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          stage="${RUNNER_TEMP:?}/${name}"
          mkdir -p "${stage}" dist
          exe="sokobanonline"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            exe="sokobanonline.exe"
          fi
          cp "target/${{ matrix.target }}/release/${exe}" "${stage}/"
          cp README.md LICENSE-APACHE LICENSE-MIT "${stage}/"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            7z a "dist/${name}.zip" "${stage}" > /dev/null
          else
            tar -czf "dist/${name}.tar.gz" -C "${RUNNER_TEMP}" "${name}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
